{% extends "base.html" %}
{% block content %}
<h2>Nueva reserva</h2>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      {{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit">Reservar</button>
</form>

<datalist id="horas-datalist">
  {% for h in horas_sugeridas %}
    <option value="{{ h }}"></option>
  {% endfor %}
</datalist>
{% endblock %}
