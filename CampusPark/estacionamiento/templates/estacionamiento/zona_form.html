{% extends "base.html" %}
{% block content %}
<h2>{% if zona %}Editar zona{% else %}Nueva zona{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      {{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit">{% if zona %}Guardar cambios{% else %}Crear zona{% endif %}</button>
</form>
<p><a href="{% url 'estacionamiento:zonas_lista' %}">Volver</a></p>
{% endblock %}
