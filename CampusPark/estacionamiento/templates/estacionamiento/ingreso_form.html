{% extends "base.html" %}
{% block content %}
<h2>Registrar ingreso</h2>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit">Ingresar vehículo</button>
</form>
<p><a href="{% url 'estacionamiento:movimientos_lista' %}">Volver</a></p>
{% endblock %}
