{% extends "base.html" %}
{% block content %}
<style>
  button a{
    color: inherit;
    text-decoration: none;
  }
</style>
<h2>{{ titulo }}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit">Guardar cambios</button>
  <button><a href="{% url 'reglas:reglamento' %}">Atrás</a></button>
</form>
{% endblock %}
