{% extends "base.html" %}
{% block content %}
<h2>{% if facultad %}Editar facultad{% else %}Nueva facultad{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit">{% if facultad %}Guardar cambios{% else %}Crear facultad{% endif %}</button>
</form>
<p><a href="{% url 'universidad:facultades_lista' %}">Volver</a></p>
{% endblock %}
